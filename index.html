<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Přístup do aplikace</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Přístup do aplikace je možný pouze po přihlášení.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230e5a8a'/><path d='M16 8v16M8 16h16' stroke='white' stroke-width='3.5' stroke-linecap='round'/></svg>">
<style>
:root{
  --blue-900:#082f4d;
  --blue-800:#0a3d62;
  --blue-700:#0e5a8a;
  --blue-600:#1478ae;
  --blue-100:#e8f3fa;
  --teal:#0f9b8e;
  --teal-100:#e4f6f4;
  --ink:#122b3c;
  --muted:#5a7285;
  --line:#dce8f0;
  --radius:16px;
  --shadow-lg:0 20px 50px rgba(10,61,98,.12);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);
  font-size:17px;
  line-height:1.6;
  background:
    radial-gradient(900px 420px at 85% -10%,rgba(15,155,142,.16),transparent 60%),
    radial-gradient(800px 380px at 5% 5%,rgba(20,120,174,.14),transparent 55%),
    linear-gradient(180deg,#fff,#f2f9fc);
  display:grid;
  place-items:center;
  padding:24px;
  -webkit-font-smoothing:antialiased;
}
.card{
  width:100%;
  max-width:430px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  padding:clamp(26px,5vw,38px);
}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:1.12rem;color:var(--blue-900);margin-bottom:22px}
.brand-mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(140deg,var(--blue-700),var(--teal));display:grid;place-items:center;flex:0 0 auto}
.brand-mark svg{width:20px;height:20px}
h1{font-size:1.45rem;font-weight:700;margin:0 0 .35em;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.95rem;margin:0 0 1.6em}
label{display:block;font-size:.85rem;font-weight:650;color:var(--blue-800);margin-bottom:.35em}
input[type="text"],input[type="password"]{
  width:100%;
  padding:.78em .95em;
  font:inherit;
  font-size:1rem;
  color:var(--ink);
  background:#fbfdff;
  border:1px solid var(--line);
  border-radius:10px;
  transition:border-color .12s ease,box-shadow .12s ease;
}
input[type="text"]:focus,input[type="password"]:focus{
  outline:none;
  border-color:var(--blue-600);
  box-shadow:0 0 0 3px rgba(20,120,174,.15);
}
.field{margin-bottom:1.1em}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  width:100%;
  font:inherit;font-weight:650;font-size:1rem;
  color:#fff;background:var(--blue-700);
  border:1px solid transparent;border-radius:999px;
  padding:.8em 1.4em;cursor:pointer;
  box-shadow:0 8px 20px rgba(14,90,138,.25);
  transition:transform .12s ease,background .12s ease;
}
.btn:hover{transform:translateY(-1px);background:var(--blue-800)}
.btn[disabled]{opacity:.6;cursor:progress;transform:none}
.alert{
  display:none;
  margin:0 0 1.2em;
  padding:.7em .9em;
  font-size:.9rem;
  color:#8c3b22;
  background:#fff6f3;
  border:1px solid #ffd9d0;
  border-radius:10px;
}
.alert.show{display:block}
.note{
  margin:1.6em 0 0;
  padding-top:1.1em;
  border-top:1px solid var(--line);
  font-size:.83rem;
  color:var(--muted);
}
.note a{color:var(--blue-700)}
.foot{margin-top:1em;font-size:.78rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <main class="card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      Sestřička
    </div>
    <h1>Přístup do aplikace</h1>
    <p class="sub">Zadejte prosím přihlašovací údaje, které jste obdrželi.</p>
    <div class="alert" id="err" role="alert" aria-live="polite"></div>
    <form id="login" novalidate autocomplete="off">
      <div class="field">
        <label for="user">Uživatelské jméno</label>
        <input id="user" name="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="pass">Heslo</label>
        <input id="pass" name="pass" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" id="submit">Přihlásit se</button>
    </form>
    <p class="note">Projekt je ve vývoji a přístup mají pouze pozvaní uživatelé. Nemáte přístupové údaje? <a href="mailto:info@sestricka.online?subject=%C5%BD%C3%A1dost%20o%20p%C5%99%C3%ADstup">Napište nám</a>.</p>
  </main>
  <p class="foot">© 2026 · Všechna práva vyhrazena</p>
</div>
<script>
function sha256(ascii){
  function rightRotate(v,a){return (v>>>a)|(v<<(32-a));}
  var mathPow=Math.pow,maxWord=mathPow(2,32),i,j,result='';
  var words=[],asciiBitLength=ascii.length*8;
  var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],primeCounter=k.length;
  var isComposite={};
  for(var candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(i=0;i<313;i+=candidate){isComposite[i]=candidate;}
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56){ascii+='\x00';}
  for(i=0;i<ascii.length;i++){
    j=ascii.charCodeAt(i);
    if(j>>8){return '';}
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(asciiBitLength/maxWord)|0;
  words[words.length]=asciiBitLength;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      var temp1=hash[7]+(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))+w[i-7]+(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0);
      var temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(i=0;i<8;i++){hash[i]=(hash[i]+oldHash[i])|0;}
  }
  for(i=0;i<8;i++){
    for(j=3;j+1;j--){
      var b=(hash[i]>>(j*8))&255;
      result+=((b<16)?0:'')+b.toString(16);
    }
  }
  return result;
}
function utf8(s){return Array.from(new TextEncoder().encode(s)).map(function(b){return String.fromCharCode(b);}).join('');}
(function(){
  var AUTH='b30b009304581e829ba72879d49b6d9dd26a427ba68e2bda2cb0dce0184e5f4d';
  var KEY='sestricka.auth';
  try{ if(sessionStorage.getItem(KEY)==='ok'){ location.replace('home.html'); return; } }catch(e){}
  var form=document.getElementById('login'),err=document.getElementById('err'),btn=document.getElementById('submit');
  function fail(m){ err.textContent=m; err.classList.add('show'); }
  form.addEventListener('submit',function(e){
    e.preventDefault();
    err.classList.remove('show');
    var u=(document.getElementById('user').value||'').trim().toLowerCase();
    var p=document.getElementById('pass').value||'';
    if(!u||!p){ fail('Vyplňte prosím uživatelské jméno i heslo.'); return; }
    btn.disabled=true;
    if(sha256(utf8(u+':'+p))===AUTH){
      try{ sessionStorage.setItem(KEY,'ok'); }catch(x){}
      location.replace('home.html');
    }else{
      btn.disabled=false;
      document.getElementById('pass').value='';
      fail('Přihlášení se nezdařilo. Zkontrolujte prosím zadané údaje.');
    }
  });
})();
</script>
</body>
</html>
